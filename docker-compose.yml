services:
  afvalapp:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - db_data:/data
    environment:
      - DATABASE_PATH=/data/afvalapp.db
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - afvalapp

volumes:
  db_data:
